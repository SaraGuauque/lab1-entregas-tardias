# Verificación integral tras revisión de informe y conclusiones de S14
name: S14 - PCA y validación - ID 17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ejecutar_olist_s14_id17.yml'

permissions:
  contents: write

jobs:
  ejecutar-s14:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar estructura y código
        run: python -m pytest -q

      - name: Ejecutar S14 con Olist real
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python scripts/ejecutar_s14.py

      - name: Verificar métricas, KS, PCA y evidencias
        run: python scripts/verificar_s14.py

      - name: Respaldar resultados de S14
        uses: actions/upload-artifact@v4
        with:
          name: olist-s14-lab2-id17
          path: |
            notebooks/S14_Lab2_PCA_Validacion_ID_17.ipynb
            reports/S14_*
            reports/figuras/S14_*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar resultados en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/S14_Lab2_PCA_Validacion_ID_17.ipynb
          git add reports/S14_* reports/figuras/S14_*
          if git diff --cached --quiet; then
            echo "El S14 ya estaba al día."
          else
            git commit -m "S14: resultados reales y figuras del laboratorio 2 ID17"
            git push origin HEAD:main
          fi
